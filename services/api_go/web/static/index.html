<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="私有化抖音内容提取：去水印下载 · 文案转写">
  <title>Luxury Capture</title>
  <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F7CFF'/%3E%3Cpath d='M10 8.5l6 3.5-6 3.5z' fill='%23fff'/%3E%3C/svg%3E">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('dc_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <audio id="task-music-audio" loop></audio>

  <header class="topbar">
    <div class="topbar-inner">
      <button id="sidebar-toggle" class="ghost icon-btn" type="button" aria-label="菜单" title="菜单" aria-expanded="false"></button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="m10.5 9 5.5 3-5.5 3Z"/></svg></span>
        <span class="brand-text">
          <h1>Luxury Capture</h1>
          <p>私有化抖音内容提取 · 去水印下载 · 文案转写</p>
        </span>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="ghost icon-btn" type="button" aria-label="切换主题"></button>
        <button id="logout" class="ghost hidden" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg><span class="btn-label">退出</span></button>
      </div>
    </div>
  </header>
  <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

  <div class="shell">
    <section id="login" class="panel narrow">
      <div class="login-head">
        <span class="brand-mark lg" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="m10.5 9 5.5 3-5.5 3Z"/></svg></span>
        <h2>欢迎回来</h2>
        <p class="meta">登录以使用你的私有化抖音内容提取服务</p>
      </div>
      <form id="api-form" class="api-form">
        <label>API 服务地址<input id="api-url" type="url" placeholder="http://127.0.0.1:8080" required></label>
        <button type="submit" class="ghost">连接此服务</button>
      </form>
      <div class="divider"><span>账号登录</span></div>
      <form id="login-form">
        <label>用户名<input id="username" autocomplete="username" maxlength="64" required></label>
        <label>密码<span class="password-wrap"><input id="password" type="password" autocomplete="current-password" maxlength="1024" required><button id="toggle-password" class="password-eye" type="button" aria-label="显示密码" title="显示密码"></button></span></label>
        <button type="submit" class="btn-primary">登录</button>
      </form>
    </section>

    <div id="app" class="hidden">
      <div class="layout master">
        <aside class="master-list">
          <div class="sidebar-brand">
            <span class="brand-mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="m10.5 9 5.5 3-5.5 3Z"/></svg></span>
            <span class="brand-text"><strong>Luxury Capture</strong><small>私有化抖音内容提取</small></span>
          </div>
          <button id="new-task-btn" class="btn-primary new-btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>新建任务</button>
          <form id="search-form" class="master-filter">
            <div class="search-wrap">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="query" placeholder="搜索标题 / 作者 / 链接">
            </div>
            <div class="filter-row">
              <select id="status">
                <option value="">全部状态</option>
                <option value="queued">排队中</option>
                <option value="processing">处理中</option>
                <option value="retry_wait">等待重试</option>
                <option value="completed">已完成</option>
                <option value="failed">失败</option>
                <option value="cancelled">已取消</option>
              </select>
              <button id="refresh" class="ghost icon-btn" type="button" title="搜索" aria-label="搜索"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
            </div>
          </form>
          <div id="job-list" class="job-list"></div>
          <div class="master-foot">
            <span id="job-total"></span>
            <span class="foot-api">API <span id="current-api"></span></span>
            <a href="#" id="settings-link" class="admin-only hidden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>设置</a>
          </div>
        </aside>

        <main class="content">
          <section id="view-new" class="panel">
            <h2>新建任务</h2>
            <p class="meta">粘贴抖音分享文本或作品链接，点击提取。视频会自动下载并转写口播；图文/动图会下载全部配图并生成配文。</p>
            <form id="capture-form">
              <label>抖音分享文本<textarea id="share-text" rows="4" maxlength="4096" placeholder="复制抖音里的「分享」文案并整段粘贴，例如：8.88 复制打开抖音，看看【某作者】的作品…#话题" required></textarea></label>
              <label class="check"><input id="info-only" type="checkbox">仅解析信息（不下载媒体）</label>
              <button id="submit-task" class="btn-primary" type="submit">提取内容</button>
            </form>
          </section>

          <section id="view-detail" class="hidden">
            <div id="detail"></div>
          </section>

          <section id="view-settings" class="panel hidden">
            <h2>大模型 API Key</h2>
            <p class="meta">只需输入抖音链接；服务端会自动下载视频、提取临时音频并上传硅基流动。阿里云作为可选备用，需要公网 HTTPS 地址。密钥加密保存且不会回显。</p>
            <form id="provider-form">
              <label>当前转写模型
                <input id="asr-model" list="asr-model-options" maxlength="256" placeholder="FunAudioLLM/SenseVoiceSmall">
                <datalist id="asr-model-options">
                  <option value="FunAudioLLM/SenseVoiceSmall"></option>
                </datalist>
              </label>
              <label>阿里云 DashScope API Key<input id="aliyun-key" type="password" autocomplete="new-password" maxlength="4096" placeholder="当前状态：未配置"></label>
              <label class="check"><input id="clear-aliyun" type="checkbox">清除阿里云 Key</label>
              <label>硅基流动 API Key<input id="silicon-key" type="password" autocomplete="new-password" maxlength="4096" placeholder="当前状态：未配置"></label>
              <label class="check"><input id="clear-silicon" type="checkbox">清除硅基流动 Key</label>
              <button type="submit" class="btn-primary">安全保存</button>
            </form>
          </section>
        </main>
      </div>
    </div>
  </div>

  <div id="preview-modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <strong id="preview-title">视频预览</strong>
        <div class="modal-actions">
          <button type="button" class="modal-close" data-close aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
      </div>
      <button class="preview-nav preview-prev hidden" type="button" data-preview-nav="-1" aria-label="上一张" title="上一张"></button>
      <button class="preview-nav preview-next hidden" type="button" data-preview-nav="1" aria-label="下一张" title="下一张"></button>
      <video id="preview-video" class="hidden" controls playsinline></video>
      <img id="preview-image" class="hidden preview-image" alt="">
    </div>
  </div>

  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card confirm-card">
      <div class="modal-head"><strong id="confirm-title">确认操作</strong><button type="button" class="modal-close" data-close aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
      <div class="confirm-body"><p id="confirm-message"></p></div>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="ghost" type="button">取消</button>
        <button id="confirm-ok" class="btn-danger" type="button">确认</button>
      </div>
    </div>
  </div>

  <button id="back-top" class="back-top hidden" type="button" aria-label="返回顶部" title="返回顶部"></button>
  <script src="/app.js" defer></script>
</body>
</html>
