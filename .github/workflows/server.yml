name: Server Linux Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build Linux packages
        shell: bash
        run: |
          VERSION=$(cat ../../VERSION)
          COMMIT=${GITHUB_SHA::12}
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/why-qw1ko/LuxuryVideoTool/services/api_go/internal/version.Version=$VERSION -X github.com/why-qw1ko/LuxuryVideoTool/services/api_go/internal/version.Commit=$COMMIT -X github.com/why-qw1ko/LuxuryVideoTool/services/api_go/internal/version.BuildTime=$BUILD_TIME"
          rm -rf ../../dist
          mkdir -p ../../dist
          for ARCH in amd64 arm64; do
            PACKAGE="douyin-capture-linux-$ARCH-$VERSION"
            OUT="../../dist/$PACKAGE"
            mkdir -p "$OUT"
            GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$OUT/douyin-capture-server" ./cmd/server
            GOOS=linux GOARCH="$ARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$OUT/douyin-capture-admin" ./cmd/admin
            cp ../../.env.example "$OUT/.env.example"
            cp ../../scripts/linux/start-web.sh "$OUT/start-web.sh"
            cp ../../scripts/linux/initialize-package.sh "$OUT/initialize-admin.sh"
            cp ../../docs/operations/Linux服务器部署说明.md "$OUT/README.md"
            chmod +x "$OUT/douyin-capture-server" "$OUT/douyin-capture-admin" "$OUT/start-web.sh" "$OUT/initialize-admin.sh"
            tar -czf "../../dist/$PACKAGE.tar.gz" -C ../../dist "$PACKAGE"
          done
          cd ../../dist
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-packages
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
