name: Server

on:
  push:
    paths:
      - services/api_go/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - services/api_go/**
      - .github/workflows/server.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build linux targets
        shell: bash
        run: |
          VERSION=$(cat ../../VERSION)
          COMMIT=${GITHUB_SHA::12}
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/why-qw1ko/LuxuryVideoTool/services/api_go/internal/version.Version=$VERSION -X github.com/why-qw1ko/LuxuryVideoTool/services/api_go/internal/version.Commit=$COMMIT -X github.com/why-qw1ko/LuxuryVideoTool/services/api_go/internal/version.BuildTime=$BUILD_TIME"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o bin/douyin-capture-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o bin/douyin-capture-linux-arm64 ./cmd/server
          sha256sum bin/* > bin/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: services/api_go/bin/
